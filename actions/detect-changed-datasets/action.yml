name: Detect Changed Datasets
description: |
  Rileva i dataset cambiati in una PR. Restituisce le dir con dataset.yml.
  Il caller deve passare GH_TOKEN come env var (secrets.GITHUB_TOKEN).

inputs:
  paths:
    description: "Path prefixes da cercare (space-separated)"
    required: true
  exclude:
    description: "Regex per escludere file"
    default: "\\.(md|ipynb|png|jpg|jpeg|gif|svg)$|/(out|__pycache__)/"
  datasets:
    description: "Uno o più slug separati da virgola (o path del dataset.yml). Vuoto = nessuno. Vedi ADR-002."
    default: ""

outputs:
  dirs:
    description: "Space-separated list di dir con dataset.yml"
    value: ${{ steps.detect.outputs.dirs }}
  count:
    description: "Numero di dataset trovati"
    value: ${{ steps.detect.outputs.count }}
  found:
    description: "true se ci sono dataset da processare"
    value: ${{ steps.detect.outputs.found }}

runs:
  using: "composite"
  steps:
    - name: Detect changed datasets
      id: detect
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        EXCLUDE: ${{ inputs.exclude }}
        DATASETS: ${{ inputs.datasets }}
      run: |
        : > changed.txt

        if [ -n "$DATASETS" ]; then
          # ADR-002: uno o più slug separati da virgola (spazi tollerati).
          # Ogni voce può essere lo slug della cartella (es. mase-gas-import)
          # oppure il path del config (es. datasets/laureati/dataset.yml).
          #
          # Più dataset in un solo run servono perché il registry si costruisce
          # dagli artifact locali del run: un dispatch per dataset dà N registry
          # PR sullo stesso branch, che si sovrascrivono.
          for item in $(echo "$DATASETS" | tr ',' ' '); do
            if [ -f "$item" ] && [ "$(basename "$item")" = "dataset.yml" ]; then
              echo "$(dirname "$item")" >> changed.txt
              continue
            fi
            for base in $PATHS; do
              if [ -f "$base/$item/dataset.yml" ]; then
                echo "$base/$item" >> changed.txt
              fi
            done
          done
        else
          PR_NUMBER="${{ github.event.pull_request.number }}"
          if [ -z "$PR_NUMBER" ]; then
            echo "::warning::Nessuna PR number - skip detect"
            echo "dirs=" >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PATHS_REGEX=$(echo "$PATHS" | sed 's/ /|/g')

          gh pr view "$PR_NUMBER" --json files --jq '.files[].path' | \
            grep -E "^($PATHS_REGEX)/" | \
            grep -vE "$EXCLUDE" | \
            cut -d/ -f1-2 | sort -u > raw_dirs.txt || true

          while read -r d; do
            [ -n "$d" ] && [ -f "$d/dataset.yml" ] && echo "$d" >> changed.txt
          done < raw_dirs.txt
        fi

        if [ -s changed.txt ]; then
          DIRS=$(sort -u changed.txt | tr '\n' ' ' | sed 's/ $//')
          COUNT=$(sort -u changed.txt | wc -l | tr -d ' ')
          echo "dirs=$DIRS" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "Trovati $COUNT dataset: $DIRS"
        else
          echo "dirs=" >> "$GITHUB_OUTPUT"
          echo "count=0" >> "$GITHUB_OUTPUT"
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "Nessun dataset trovato"
        fi
