name: 'GCS Auth (org-level)'
description: >
  Auth GCP per sync GCS — WIF (consigliato) o SA key (legacy).
  Il caller deve autenticare PRIMA con google-github-actions/auth@v3
  (workload_identity_provider + service_account) oppure passare env GCP_SA_KEY.
  Non usare espressioni secrets nella description: GitHub fa template
  validation anche sugli esempi nel description e fallisce il load.
  Output: ready=true|false.

outputs:
  ready:
    description: true se l'auth è riuscita, false se nessun metodo configurato
    value: ${{ steps.auth.outputs.ready }}

runs:
  using: "composite"
  steps:
    - name: Authenticate to Google Cloud
      id: auth
      shell: bash
      env:
        GCP_SA_KEY: ${{ env.GCP_SA_KEY }}
      run: |
        # ── Pattern 1: WIF (se google-github-actions/auth ha già autenticato) ──
        # google-github-actions/auth imposta GOOGLE_APPLICATION_CREDENTIALS
        # e ADC. Se il file esiste, gcloud è già autenticato.
        if [ -n "$GOOGLE_APPLICATION_CREDENTIALS" ] && [ -f "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
          echo "::notice::GCS Auth: WIF attivo (GOOGLE_APPLICATION_CREDENTIALS trovato)"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # ── Pattern 2: SA key legacy ──
        if [ -z "$GCP_SA_KEY" ]; then
          echo "::notice::Nessun metodo GCS auth configurato (né WIF né SA key) — skip GCS sync"
          echo "ready=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "::notice::GCS Auth: usa SA key legacy (considerea migrazione a WIF)"
        # Supporta sia JSON raw che base64
        if echo "$GCP_SA_KEY" | python3 -c "import json,sys; json.load(sys.stdin)" 2>/dev/null; then
          printf '%s\n' "$GCP_SA_KEY" > /tmp/gcp-key.json
        else
          printf '%s\n' "$GCP_SA_KEY" | base64 -d > /tmp/gcp-key.json 2>/dev/null
        fi
        if [ ! -s /tmp/gcp-key.json ]; then
          echo "::error::GCP_SA_KEY non è un JSON valido né base64"
          exit 1
        fi
        if ! gcloud auth activate-service-account --key-file=/tmp/gcp-key.json; then
          echo "::error::Auth GCP fallita"
          exit 1
        fi
        echo "ready=true" >> "$GITHUB_OUTPUT"
