name: 'Python Setup (org-level)'
description: |
  Setup Python 3.12 con pip cache e installa dipendenze (pyproject.toml o requirements.txt) +
  pacchetti extra opzionali.

  Action org-level disponibile per tutti i repo DataCivicLab.
  Il checkout deve essere fatto PRIMA di chiamare questa action
  (le composite action locali non possono contenere actions/checkout).

  Self-hosted: pip considera soddisfatte le dipendenze git senza ref
  (`pkg @ git+...`) e non le riaggiorna tra una run e l'altra: su un runner
  persistente il toolkit resta alla versione installata la prima volta (visto
  su rna-aiuti-stato: registry v1 scritto con il CLI vecchio). Per questo su
  `runner.environment == 'self-hosted'` l'install usa `--force-reinstall`.

  Install order:
  1. pyproject.toml → pip install -e ".[extras]" (se esiste)
  2. requirements.txt → pip install -r (legacy, se pyproject non esiste)
  3. extra-requirements files
  4. extra-packages

  Usage:
    - uses: actions/checkout@v6
    - uses: dataciviclab/.github/actions/python-setup@main
      with:
        install-extras: "dev,pipeline"
        extra-packages: ruff mypy
        extra-requirements: tools/clean-query-mcp/requirements.txt

inputs:
  python-version:
    description: Versione Python
    default: "3.12"
    required: false
  install-extras:
    description: |
      Extras da installare con pyproject.toml (comma-separated).
      Default: "dev" (lint/test tools). Usa "dev,pipeline" per repo con toolkit.
    default: "dev"
    required: false
  extra-packages:
    description: |
      Pacchetti pip extra separati da spazio
      (es. "ruff mypy pytest-cov")
    default: ""
    required: false
  extra-requirements:
    description: |
      Path a requirements.txt extra separati da spazio
      (es. "tools/clean-query-mcp/requirements.txt")
    default: ""
    required: false

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'

    - name: Install core dependencies
      shell: bash
      env:
        RUNNER_ENV: ${{ runner.environment }}
      run: |
        EXTRAS="${{ inputs.install-extras }}"
        # Runner persistente: le URL git senza ref (`@ git+https://…`) restano
        # "già soddisfatte" e non vengono riaggiornate. Su self-hosted si forza
        # la ri-risoluzione, altrimenti il toolkit resta alla versione del primo
        # setup (es. registry v1 scritto dal CLI vecchio).
        FORCE=""
        if [ "$RUNNER_ENV" = "self-hosted" ]; then
          FORCE="--force-reinstall"
          echo "::notice::runner self-hosted: force-reinstall delle dipendenze (URL git senza ref)"
        fi
        if [ -f pyproject.toml ]; then
          echo "::group::pip install $FORCE -e .[$EXTRAS]"
          python -m pip install $FORCE -e ".[$EXTRAS]"
          echo "::endgroup::"
        elif [ -f requirements.txt ]; then
          echo "::group::pip install $FORCE -r requirements.txt"
          python -m pip install $FORCE -r requirements.txt
          echo "::endgroup::"
        else
          echo "::notice::No pyproject.toml or requirements.txt found — skip core install"
        fi

    - name: Install extra requirements files
      if: inputs.extra-requirements != ''
      shell: bash
      run: |
        for req in ${{ inputs.extra-requirements }}; do
          if [ -f "$req" ]; then
            python -m pip install -r "$req"
          fi
        done

    - name: Install extra packages
      if: inputs.extra-packages != ''
      shell: bash
      run: python -m pip install ${{ inputs.extra-packages }}
