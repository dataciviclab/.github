name: 'Registry Update PR (org-level)'
description: |
  Build registry → diff → draft PR, come STEP nel job della pipeline.

  Salta sui run selettivi: `partitions` si deriva dai parquet locali del run
  e sarebbe una fotografia parziale. Due guardie:
  - `pull_request` (post-merge) → salta subito;
  - `toolkit registry build --require-complete` → exit 3 se un dataset con
    `clean:` non ha parquet nel run (copre anche i dispatch con dataset
    scelti, senza dipendere dal nome dell'input).

  DEVE girare nello stesso job del run (con `out/` popolato): il registry
  deriva le entry dai parquet locali (`toolkit registry build`), quindi in un
  job separato su runner fresco produrrebbe un catalogo vuoto.

  Usage (nello stesso job, dopo il run pipeline):
    - uses: dataciviclab/.github/actions/registry-update-pr@main
      with:
        prefix: "eurostat"
        flat: "true"
      env:
        GH_TOKEN: secrets.GITHUB_TOKEN

  NON installa il toolkit: usa quello già presente nel job (installato da
  python-setup) — così il registry è derivato con la STESSA versione del
  toolkit che ha prodotto i parquet in out/. Il job chiamante deve avere
  `permissions: contents: write, pull-requests: write`.

inputs:
  prefix:
    description: Prefix per `toolkit registry build --prefix <prefix>`.
    required: false
    default: ""
  flat:
    description: Aggiunge `--flat` al registry build.
    required: false
    default: "false"
  registry-dir:
    description: Directory registry controllata nel diff (git status).
    required: false
    default: "registry"

runs:
  using: "composite"
  steps:
    # Il registry deriva `partitions` dai parquet locali del run: su un run
    # selettivo (post-merge PR, dispatch con `datasets`) l'out/ contiene solo i
    # dataset eseguiti e il registry risultante è una fotografia parziale.
    # Si aggiorna solo sui run completi (schedule/dispatch senza selezione).
    - name: Skip on selective runs
      if: github.event_name == 'pull_request'
      shell: bash
      run: |
        echo "::notice::registry aggiornato solo su run completi (schedule/dispatch), non sui run post-merge selettivi"

    - name: Build registry
      id: build
      if: github.event_name != 'pull_request'
      shell: bash
      run: |
        command -v toolkit >/dev/null 2>&1 || {
          echo "::error::toolkit non trovato — registry-update-pr deve girare "
          echo "in un job dove python-setup ha già installato il toolkit"
          exit 1
        }
        CMD="toolkit registry build"
        if [ -n "${{ inputs.prefix }}" ]; then CMD="$CMD --prefix ${{ inputs.prefix }}"; fi
        if [ "${{ inputs.flat }}" = "true" ]; then CMD="$CMD --flat"; fi
        set +e
        $CMD --write --require-complete
        rc=$?
        set -e
        if [ "$rc" = "3" ]; then
          echo "::notice::run incompleta: registry non aggiornato (serve un run completo)"
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        exit "$rc"

    - name: Check registry diff
      id: diff
      if: github.event_name != 'pull_request' && steps.build.outputs.skip != 'true'
      shell: bash
      run: |
        # registry/ è untracked su main (generato dal builder) —
        # git diff ignora gli untracked, quindi usiamo git status.
        if git status --porcelain -- ${{ inputs.registry-dir }} | grep -q .; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Create draft registry PR
      if: >-
        github.event_name != 'pull_request'
        && steps.build.outputs.skip != 'true'
        && steps.diff.outputs.changed == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ env.GH_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number || 'schedule' }}
      run: |
        BRANCH="post-merge-registry/${PR_NUMBER}-registry"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git checkout -B "$BRANCH"
        git add ${{ inputs.registry-dir }}
        git commit -m "chore(post-merge): aggiorna registry ($PR_NUMBER)" || exit 0
        # Il branch viene ricreato a ogni run (`checkout -B` da HEAD + un
        # commit), quindi il push è un force. La lease implicita di
        # `--force-with-lease` deve confrontare il ref remoto, che in un
        # checkout shallow (`checkout-fetch-depth: 1`) non esiste: git rifiuta
        # con `! [rejected] ... (stale info)` e dal secondo run il registry non
        # si aggiorna più. Riprodotto con un clone `--depth 1` e un branch
        # remoto esistente: exit 1 senza lease, exit 0 con quella esplicita.
        # La lease esplicita rende il passo indipendente dalla profondità.
        REMOTE_SHA=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
        if [ -n "$REMOTE_SHA" ]; then
          git push --force-with-lease="$BRANCH:$REMOTE_SHA" -u origin "$BRANCH"
        else
          # branch nuovo: niente da sovrascrivere, la lease non serve
          git push -u origin "$BRANCH"
        fi
        EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number // empty')
        if [ -n "$EXISTING_PR" ]; then
          gh pr edit "$EXISTING_PR" \
            --title "chore(post-merge): aggiorna registry ($PR_NUMBER)" \
            --body "Registry artifacts updated after pipeline run." \
            --add-label post-merge
        else
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(post-merge): aggiorna registry ($PR_NUMBER)" \
            --body "Registry artifacts updated after pipeline run." \
            --label post-merge \
            --draft
        fi
