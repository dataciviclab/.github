name: Dataset Config Check (reusable)

on:
  workflow_call:
    inputs:
      install:
        description: Comando pip per installare toolkit (e deps).
        required: false
        type: string
        default: "pip install git+https://github.com/dataciviclab/toolkit.git"
      globs:
        description: >
          Directory da scandire per `dataset.yml`, separate da spazio.
          Es. "datasets" o "datasets support".
        required: false
        type: string
        default: "datasets"
      years:
        description: >
          Anni per il preflight (comma-separated, es. "2025,2026") oppure
          "from-config" per leggere gli anni dal dataset.yml.
        required: false
        type: string
        default: "from-config"
      exclude:
        description: >
          Regex applicata al nome della directory dataset da escludere
          (es. "varchi-ztl"). Vuoto = nessuna esclusione.
        required: false
        type: string
        default: ""
      configs:
        description: >
          Lista di path dataset.yml da validare (uno per riga, newline-separated).
          Se fornita, controlla SOLO questi path (ignora globs).
          Vuota = controlla tutti i dataset.yml nei globs (comportamento default).
        required: false
        type: string
        default: ""

jobs:
  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install toolkit
        run: |
          ${{ inputs.install }}
          pip install pyyaml

      - name: Validate all dataset configs (preflight)
        env:
          GLOBS: ${{ inputs.globs }}
          YEARS: ${{ inputs.years }}
          EXCLUDE: ${{ inputs.exclude }}
          CONFIGS: ${{ inputs.configs }}
          TOOLKIT_ALLOW_SCRIPT_SOURCE: "1"
        run: |
          ERRORS=0
          # Se configs è fornito, usa solo quelli; altrimenti find su globs
          if [ -n "$CONFIGS" ]; then
            echo "→ Modalità: configs specifici"
            echo "$CONFIGS" | tr " " "\n" > /tmp/configs.txt
          else
            echo "→ Modalità: tutti i dataset nei globs"
            : > /tmp/configs.txt
            for glob in $GLOBS; do
              find "$glob" -name dataset.yml >> /tmp/configs.txt
            done
            sort -o /tmp/configs.txt /tmp/configs.txt
          fi
          TOTAL=$(wc -l < /tmp/configs.txt | tr -d ' ')
          echo "→ $TOTAL config da validare"
          while IFS= read -r cfg; do
            [ -z "$cfg" ] && continue
            dir=$(basename "$(dirname "$cfg")")
            if [ -n "$EXCLUDE" ] && echo "$dir" | grep -qE "$EXCLUDE"; then
              echo "→ $cfg (skip: $dir)"
              continue
            fi
            if [ "$YEARS" = "from-config" ]; then
              Y=$(python3 -c "import yaml; print(','.join(str(x) for x in yaml.safe_load(open('$cfg'))['dataset']['years']))")
            else
              Y="$YEARS"
            fi
            echo "→ $cfg (years: $Y)"
            if toolkit run preflight --config "$cfg" --years "$Y" > /dev/null 2>&1; then
              echo "  ✅ OK"
            else
              echo "  ⚠️  FAILED (fonte irraggiungibile o config invalida)"
              ERRORS=$((ERRORS + 1))
            fi
          done < /tmp/configs.txt
          if [ "$ERRORS" -gt 0 ]; then
            echo "⚠️  $ERRORS config hanno fallito il preflight (non blocking)"
          fi
          echo "✅ Preflight completato"
