name: Dataset Config Check (reusable)

on:
  workflow_call:
    inputs:
      install:
        description: >
          Comando pip per installare toolkit (e deps).
          Default: pip install -e ".[dev,pipeline]"
        required: false
        type: string
        default: 'pip install -e ".[dev,pipeline]"'
      globs:
        description: >
          Directory da scandire per `dataset.yml`, separate da spazio.
          Es. "datasets" o "datasets support".
        required: false
        type: string
        default: "datasets"
      years:
        description: >
          Anni per il preflight (comma-separated, es. "2025,2026") oppure
          "from-config" per leggere gli anni dal dataset.yml.
        required: false
        type: string
        default: "from-config"
      exclude:
        description: >
          Regex applicata al nome della directory dataset da escludere
          (es. "varchi-ztl"). Vuoto = nessuna esclusione.
        required: false
        type: string
        default: ""
      configs:
        description: >
          Lista di config da validare (uno per riga, newline-separated, oppure
          separati da spazio). Ogni voce può essere il path di un dataset.yml
          oppure la directory del dataset (formato di detect-changed-datasets):
          le directory vengono risolte in <dir>/dataset.yml.
          Se fornita, controlla SOLO queste voci (ignora globs).
          Vuota = controlla tutti i dataset.yml nei globs (comportamento default).
        required: false
        type: string
        default: ""
      sql_check:
        description: >
          Valida anche clean.sql/mart SQL: sintassi (parse-only, BLOCCANTE,
          non richiede RAW) e binding contro lo schema del preview (advisory,
          non blocca). false = comportamento precedente (solo preflight rete).
        required: false
        type: boolean
        default: true

jobs:
  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install toolkit
        run: |
          ${{ inputs.install }}
          pip install pyyaml

      - name: Validate dataset configs (preflight + SQL syntax)
        env:
          GLOBS: ${{ inputs.globs }}
          YEARS: ${{ inputs.years }}
          EXCLUDE: ${{ inputs.exclude }}
          CONFIGS: ${{ inputs.configs }}
          SQL_CHECK: ${{ inputs.sql_check }}
          TOOLKIT_ALLOW_SCRIPT_SOURCE: "1"
        run: |
          SYNTAX_ERRORS=0
          WARNINGS=0
          # Se configs è fornito, usa solo quelli; altrimenti find su globs
          if [ -n "$CONFIGS" ]; then
            echo "→ Modalità: configs specifici"
            echo "$CONFIGS" | tr " " "\n" > /tmp/configs.txt
            # Accetta anche la directory del dataset (output di
            # detect-changed-datasets): la risolve in <dir>/dataset.yml.
            : > /tmp/configs.norm.txt
            while IFS= read -r entry; do
              [ -z "$entry" ] && continue
              if [ -d "$entry" ] && [ -f "$entry/dataset.yml" ]; then
                echo "$entry/dataset.yml" >> /tmp/configs.norm.txt
              else
                echo "$entry" >> /tmp/configs.norm.txt
              fi
            done < /tmp/configs.txt
            mv /tmp/configs.norm.txt /tmp/configs.txt
          else
            echo "→ Modalità: tutti i dataset nei globs"
            : > /tmp/configs.txt
            for glob in $GLOBS; do
              find "$glob" -name dataset.yml >> /tmp/configs.txt
            done
            sort -o /tmp/configs.txt /tmp/configs.txt
          fi
          TOTAL=$(wc -l < /tmp/configs.txt | tr -d ' ')
          echo "→ $TOTAL config da validare"
          while IFS= read -r cfg; do
            [ -z "$cfg" ] && continue
            dir=$(basename "$(dirname "$cfg")")
            if [ -n "$EXCLUDE" ] && echo "$dir" | grep -qE "$EXCLUDE"; then
              echo "→ $cfg (skip: $dir)"
              continue
            fi
            if [ ! -f "$cfg" ]; then
              echo "  SKIP (no dataset.yml)"
              continue
            fi
            if [ "$YEARS" = "from-config" ]; then
              Y=$(python3 -c "import yaml; print(','.join(str(x) for x in yaml.safe_load(open('$cfg'))['dataset']['years']))")
            else
              Y="$YEARS"
            fi
            echo "→ $cfg (years: $Y)"

            SQL_FLAG=""
            if [ "$SQL_CHECK" = "true" ]; then
              SQL_FLAG="--sql-check"
            fi
            REPORT=$(mktemp)
            # exit non-zero è atteso: il verdetto si legge dal JSON, perché
            # "failed" include sia errori bloccanti sia rete/preview.
            toolkit run preflight --config "$cfg" --years "$Y" $SQL_FLAG --json \
              > "$REPORT" 2>/dev/null || true

            if ! jq -e . "$REPORT" >/dev/null 2>&1; then
              echo "  ⚠️  nessun report JSON (toolkit non aggiornato o errore di avvio) — non blocking"
              WARNINGS=$((WARNINGS + 1))
              rm -f "$REPORT"
              continue
            fi

            # ── Sintassi SQL: deterministica, bloccante ──────────────────
            if [ "$SQL_CHECK" = "true" ]; then
              if [ "$(jq -r '.sql_syntax.ok' "$REPORT")" = "false" ]; then
                echo "  ❌ SQL syntax (blocking)"
                jq -r '.sql_syntax.errors[]? | "     ✗ " + .' "$REPORT"
                SYNTAX_ERRORS=$((SYNTAX_ERRORS + 1))
                rm -f "$REPORT"
                continue
              fi
              CHECKED=$(jq -r '.sql_syntax.checked | length' "$REPORT")
              echo "  ✅ SQL syntax ($CHECKED file)"
              SKIPPED=$(jq -r '.sql_syntax.skipped[]?' "$REPORT")
              if [ -n "$SKIPPED" ]; then
                echo "$SKIPPED" | sed 's/^/     ⏭ non verificabile: /'
              fi
            fi

            # ── Rete/config/preview: non deterministico, advisory ────────
            if [ "$(jq -r '.status' "$REPORT")" != "passed" ]; then
              echo "  ⚠️  preflight non deterministico fallito (fonte/config) — non blocking"
              jq -r '.config_check.errors[]? | "     ✗ config: " + .' "$REPORT"
              UNREACHABLE=$(jq -r '[.sources[] | select(.reachable == false)] | length' "$REPORT")
              if [ "$UNREACHABLE" -gt 0 ]; then
                echo "     ⚠ fonti non raggiungibili: $UNREACHABLE"
              fi
              WARNINGS=$((WARNINGS + 1))
            else
              echo "  ✅ OK"
            fi

            # ── Binding contro lo schema del preview: advisory ───────────
            jq -r '.sql_validation[]? | select(.ok == false) | "     ⚠ binding advisory (\(.year)): " + (.error | split("\n")[0])' "$REPORT" || true
            rm -f "$REPORT"
          done < /tmp/configs.txt

          if [ "$SYNTAX_ERRORS" -gt 0 ]; then
            echo "❌ $SYNTAX_ERRORS config con errori di sintassi SQL (blocking)"
            exit 1
          fi
          if [ "$WARNINGS" -gt 0 ]; then
            echo "⚠️  $WARNINGS config con warning non bloccanti (fonti/config/preview)"
          fi
          echo "✅ Config check completato"
