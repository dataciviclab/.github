# Pipeline Reusable — DataCivicLab
#
# Workflow unico post-merge + refresh. Gestisce:
#   1. checkout + python-setup
#   2. pre-run (opzionale: codelists, bootstrap)
#   3. detect (opzionale: solo dataset cambiati)
#   4. run (make target passato come input)
#   5. GCS auth (WIF) + sync (clean + mart)
#   6. registry → PR draft
#
# Il repo chiama con i propri input:
#   - run-command: comando da eseguire (es. "make run-all" o "toolkit run --batch batch.txt")
#   - repo-slug: slug del repo nel catalogo
#   - sync-prefix: prefisso GCS e registry. "auto" (default) = repo-slug;
#       stringa vuota = radice del bucket (repo che pubblicano senza prefisso,
#       es. dataset-incubator). Se valorizzato, il path su GCS e quello nel
#       catalogo seguono questo, non repo-slug.
#   - detect-paths: directory da monitorare (es. "datasets compose"). Vuoto = run all
#   - run-batch-command: comando per il batch selettivo su PR (opzionale)
#
# Batch selettivo (evita di rieseguire tutti i dataset a ogni merge):
#   basta `detect-paths` + un target `run-batch` nel Makefile del repo.
#   Il target può includere i pre-step del repo (seeds, codelists, env) che un
#   comando generico salterebbe. Se nessuno dei due è presente, la pipeline
#   esegue il run completo ed emette un warning.
#   Con `detect-paths` vuoto non si fa detect: il batch non è disponibile.

name: Pipeline (reusable)

on:
  workflow_call:
    inputs:
      repo-slug:
        description: "Slug del repo (es. conto-annuale, siope)"
        required: true
        type: string
      run-command:
        description: "Comando da eseguire per i dataset (es. make run-all)"
        required: true
        type: string
      run-batch-command:
        description: "Comando per il batch selettivo su PR (es. make run-batch). Vuoto = auto-detect: usa `make run-batch` se il Makefile del repo definisce il target, altrimenti `run-command` (con warning se detect-paths e' impostato e il batch viene ignorato)"
        default: ""
        type: string
      sync-pattern:
        description: "flat (rsync intera dir out/) o per-dataset (per slug/year)"
        default: "flat"
        type: string
      sync-prefix:
        description: >-
          Prefisso su GCS e nel registry. "auto" (default) = repo-slug.
          Stringa vuota = radice del bucket: per i repo che pubblicano senza
          prefisso di repo (es. dataset-incubator, i cui candidate stanno in
          gs://dataciviclab-{clean,mart}/<slug>/<anno>/).
        default: "auto"
        type: string
      pre-run-command:
        description: "Comando pre-run opzionale (es. detect, codelists, bootstrap)"
        default: ""
        type: string
      checkout-ref:
        description: "Ref da checkout (default: github.ref)"
        default: ""
        type: string
      checkout-fetch-depth:
        description: >-
          Profondità della storia nel checkout (default "0" = tutta la storia,
          comportamento storico). Il workflow non legge la storia: il detect
          usa l'API GitHub e il registry `git status`, quindi su un repo con
          storia pesante conviene "1" (italia-corpus: .git 1,7 GiB, checkout
          169-207s -> ~60s).
        default: "0"
        type: string
      install-extras:
        description: "Extras pyproject da installare (default: dev,pipeline)"
        default: "dev,pipeline"
        type: string
      python-extra-packages:
        description: "Extra packages per pip install"
        default: ""
        type: string
      verify-command:
        description: "Comando verify post-run (default: nessuno)"
        default: ""
        type: string
      extra-env:
        description: "Env vars extra (KEY=VALUE per riga)"
        default: ""
        type: string
      detect-paths:
        description: "Directory da monitorare per detect (es. 'datasets compose'). Vuoto = run all"
        default: ""
        type: string
      runs-on:
        description: "Runner label (es. ubuntu-latest, self-hosted)"
        default: "ubuntu-latest"
        type: string
      clean:
        description: >-
          Se true (default) il checkout pulisce i file non tracciati. Su runner
          self-hosted con disco persistente serve false: le baseline gitignored
          (parquet/cache di estrazione) devono sopravvivere tra i run.
        default: "true"
        type: string
      cache-paths:
        description: >-
          File o directory da conservare tra un run e l'altro (uno per riga).
          Vuoto = nessuna cache. Serve all'estrazione incrementale: gli script
          leggono il loro output precedente per estrarre solo le novità.
        default: ""
        type: string
      cache-key:
        description: "Prefisso della chiave di cache (obbligatorio se cache-paths è impostato)"
        default: ""
        type: string
    secrets:
      GCP_SA_KEY:
        required: false
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: false
      GCP_SERVICE_ACCOUNT:
        required: false

env:
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

jobs:
  pipeline:
    runs-on: ${{ inputs.runs-on || 'ubuntu-latest' }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
          fetch-depth: ${{ inputs.checkout-fetch-depth }}
          clean: ${{ inputs.clean != 'false' }}

      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          install-extras: ${{ inputs.install-extras }}
          extra-packages: ${{ inputs.python-extra-packages }}

      # ── Cache tra run (estrazione incrementale) ─────────────────────
      # actions/cache ripristina qui e salva nel post-step: quindi il file
      # c'è prima del run e viene aggiornato dopo, anche se il run fallisce
      # (i post-step girano salvo cancellazione).
      - name: Restore cache
        if: inputs.cache-paths != ''
        uses: actions/cache@v4
        with:
          path: ${{ inputs.cache-paths }}
          key: ${{ inputs.cache-key }}-${{ github.run_id }}
          restore-keys: |
            ${{ inputs.cache-key }}-

      # ── Extra env vars (opzionale) ──────────────────────────────────
      - name: Set extra env vars
        if: inputs.extra-env != ''
        run: echo "${{ inputs.extra-env }}" >> "$GITHUB_ENV"

      # ── Pre-run (opzionale: codelists, bootstrap) ───────────────────
      - name: Pre-run
        if: inputs.pre-run-command != ''
        run: ${{ inputs.pre-run-command }}

      # ── Detect changed datasets (solo su PR, skip su schedule/dispatch)
      - name: Detect changed datasets
        if: inputs.detect-paths != '' && github.event_name == 'pull_request'
        id: detect
        uses: dataciviclab/.github/actions/detect-changed-datasets@main
        with:
          paths: ${{ inputs.detect-paths }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build batch from detect
        if: inputs.detect-paths != '' && github.event_name == 'pull_request' && steps.detect.outputs.found == 'true'
        run: |
          : > batch.txt
          for dir in ${{ steps.detect.outputs.dirs }}; do
            [ -f "$dir/dataset.yml" ] && echo "$dir/dataset.yml" >> batch.txt
          done
          echo "📦 $(wc -l < batch.txt | tr -d ' ') dataset da processare"
          cat batch.txt

      - name: Skip — nothing changed
        if: inputs.detect-paths != '' && github.event_name == 'pull_request' && steps.detect.outputs.found != 'true'
        run: echo "✅ Nessun dataset cambiato — skip run"

      # ── Build batch per schedule/dispatch (tutti i dataset) ─────────
      - name: Build batch — all datasets
        if: inputs.detect-paths != '' && github.event_name != 'pull_request'
        run: |
          : > batch.txt
          for base in ${{ inputs.detect-paths }}; do
            [ -d "$base" ] || continue
            find "$base" -maxdepth 2 -name dataset.yml | sort >> batch.txt
          done
          echo "📦 $(wc -l < batch.txt | tr -d ' ') dataset (schedule/dispatch — tutti)"
          cat batch.txt

      # ── Resolve run command (batch vs full) ──────────────────────────
      # Batch selettivo: solo su PR, con detect-paths impostato e batch.txt
      # non vuoto. Ordine di risoluzione (il primo che esiste vince):
      #   1. `run-batch-command` esplicito
      #   2. `make run-batch` se il Makefile del repo definisce il target
      #      (convenzione consigliata: il target può includere i pre-step del
      #      repo — seeds, codelists, env — che un comando generico salterebbe)
      #   3. `run-command` se consuma già batch.txt
      #   4. `run-command` (run completo) + warning: il detect è sprecato
      - name: Resolve run command
        id: run-cmd
        if: inputs.detect-paths == '' || github.event_name != 'pull_request' || steps.detect.outputs.found == 'true'
        env:
          RUN_COMMAND: ${{ inputs.run-command }}
          RUN_BATCH_COMMAND: ${{ inputs.run-batch-command }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -s batch.txt ]; then
            if [ -n "$RUN_BATCH_COMMAND" ]; then
              CMD="$RUN_BATCH_COMMAND"; WHY="run-batch-command"
            elif grep -qE '^run-batch:' Makefile 2>/dev/null; then
              CMD="make run-batch"; WHY="target run-batch nel Makefile"
            elif printf '%s' "$RUN_COMMAND" | grep -q 'batch.txt'; then
              CMD="$RUN_COMMAND"; WHY="run-command consuma batch.txt"
            else
              CMD="$RUN_COMMAND"; WHY=""
            fi
            echo "cmd=$CMD" >> "$GITHUB_OUTPUT"
            if [ -n "$WHY" ]; then
              echo "🔧 Batch mode: $CMD  [$WHY]"
            else
              echo "🔧 Full mode: $CMD"
              echo "::warning title=detect-paths senza batch::detect-paths e' impostato ma il run e' completo: batch.txt viene costruito e ignorato. Definisci un target 'run-batch' nel Makefile (o imposta run-batch-command) per eseguire solo i dataset cambiati."
            fi
          else
            echo "cmd=$RUN_COMMAND" >> "$GITHUB_OUTPUT"
            echo "🔧 Full mode: $RUN_COMMAND"
          fi

      # ── Run datasets ────────────────────────────────────────────────
      - name: Run datasets
        if: inputs.detect-paths == '' || github.event_name != 'pull_request' || steps.detect.outputs.found == 'true'
        run: ${{ steps.run-cmd.outputs.cmd }}

      # ── Verify (opzionale) ──────────────────────────────────────────
      # Solo su run completo. Due fallimenti diversi, due semantiche:
      #   - run caduto  -> il verify è saltato e auth/sync salvano quello che
      #                    c'è (altrimenti un timeout sull'ultimo dataset butta
      #                    via un'ora di lavoro e i dataset già prodotti);
      #   - dato sbagliato -> il verify gira su un out/ completo, fallisce e
      #                    blocca auth, sync e registry.
      # Senza `success()` il verify girerebbe anche su un run rotto, leggendo un
      # out/ parziale: fallirebbe quasi sempre e trasformerebbe il salvataggio
      # del salvabile in «non pubblicare niente».
      - name: Verify output
        id: verify
        if: ${{ inputs.verify-command != '' && success() }}
        run: ${{ inputs.verify-command }}

      # ── GCS auth + sync ─────────────────────────────────────────────
      # `!cancelled()`: se un dataset fallisce il job si ferma qui, ma quello
      # che il run ha già prodotto va comunque caricato — altrimenti un
      # timeout sull'ultimo dataset butta via un'ora di lavoro.
      # `steps.verify.outcome != 'failure'`: invece un verify fallito BLOCCA
      # auth, sync e registry. Senza questo un `verify-command` che controlla
      # la qualità del dato sarebbe decorativo: il job diventa rosso e pubblica
      # lo stesso. Il verify gira solo su run completo (`success()`), quindi
      # `outcome != 'failure'` vuol dire «run ok e dato ok»; su un run rotto è
      # `skipped` e il salvataggio del salvabile resta. Con verify non
      # configurato è `skipped` e la condizione passa.
      - name: GCP Auth (for GCS push)
        if: ${{ !cancelled() && steps.verify.outcome != 'failure' && env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != '' && (inputs.detect-paths == '' || github.event_name != 'pull_request' || steps.detect.outputs.found == 'true') }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: ${{ !cancelled() && steps.verify.outcome != 'failure' && env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != '' && (inputs.detect-paths == '' || github.event_name != 'pull_request' || steps.detect.outputs.found == 'true') }}
        uses: google-github-actions/setup-gcloud@v3

      # Prefisso GCS: unica fonte per il sync e per il registry, così i due non
      # possono divergere. "auto" = repo-slug; "" = radice del bucket.
      - name: Resolve GCS prefix
        id: gcs-prefix
        # DEVE girare anche se il run è fallito: auth, sync e registry hanno
        # `!cancelled()` apposta («salva il salvabile»), e consumano questo
        # output. Senza l'`if`, lo step eredita `success()`: su un run fallito
        # viene saltato, l'output resta vuoto e sync/registry scrivono alla
        # RADICE del bucket invece che sotto il prefisso del repo.
        # È successo il 2026-11-19 in open-politica #121: run fallito →
        # prefisso vuoto → registry riscritto senza `open-politica/`.
        if: ${{ !cancelled() && (inputs.detect-paths == '' || github.event_name != 'pull_request' || steps.detect.outputs.found == 'true') }}
        env:
          INPUT_PREFIX: ${{ inputs.sync-prefix }}
          REPO_SLUG: ${{ inputs.repo-slug }}
        run: |
          prefix="$INPUT_PREFIX"
          if [ "$prefix" = "auto" ]; then prefix="$REPO_SLUG"; fi
          if [ "$INPUT_PREFIX" = "auto" ] && [ -z "$prefix" ]; then
            echo "::error::repo-slug vuoto: impossibile risolvere sync-prefix='auto'. Passa repo-slug o un sync-prefix esplicito."
            # Nota: `exit 1` da solo NON ferma la scrittura. Gli step con
            # `!cancelled()` girano lo stesso, quindi il blocco vero è
            # `steps.gcs-prefix.outcome != 'failure'` sulle condizioni di sync
            # e registry.
            exit 1
          fi
          case "$prefix" in
            *://*)
              echo "::error::sync-prefix='$prefix' sembra una URI: usa solo il prefisso (es. 'eurostat'), non 'gs://bucket/…'."
              exit 1
              ;;
          esac
          # 'foo/', '/foo' e '/foo/' devono produrre lo stesso prefisso: se la
          # barra resta, il path su GCS e quello nel catalogo sono coerenti tra
          # loro ma sbagliati, e nessuno se ne accorge.
          prefix=$(printf '%s' "$prefix" | sed 's:^/::; s:/*$::')
          echo "value=$prefix" >> "$GITHUB_OUTPUT"
          echo "📁 prefisso GCS: ${prefix:-<radice>}"

      # Sync flat: rsync intera dir out/ al prefisso
      - name: Sync to GCS (flat)
        if: ${{ !cancelled() && steps.verify.outcome != 'failure' && steps.gcs-prefix.outcome != 'failure' && env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && inputs.sync-pattern == 'flat' && (inputs.detect-paths == '' || github.event_name != 'pull_request' || steps.detect.outputs.found == 'true') }}
        env:
          PREFIX: ${{ steps.gcs-prefix.outputs.value }}
        run: |
          seg="${PREFIX:+$PREFIX/}"
          gsutil -m rsync -r out/data/mart/ "gs://dataciviclab-mart/${seg}"
          gsutil -m rsync -r out/data/clean/ "gs://dataciviclab-clean/${seg}"
          echo "✅ Synced to gs://dataciviclab-mart|clean/${seg}"

      # Sync per-dataset: per slug, tutti gli anni + file a livello dataset
      # (tabelle multi-anno: mart.tables[].years produce <slug>/<tabella>.parquet,
      # non una cartella anno).
      - name: Sync to GCS (per-dataset)
        if: ${{ !cancelled() && steps.verify.outcome != 'failure' && steps.gcs-prefix.outcome != 'failure' && env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && inputs.sync-pattern == 'per-dataset' && (inputs.detect-paths == '' || github.event_name != 'pull_request' || steps.detect.outputs.found == 'true') }}
        env:
          PREFIX: ${{ steps.gcs-prefix.outputs.value }}
        run: |
          seg="${PREFIX:+$PREFIX/}"
          for slug_dir in out/data/clean/*/; do
            [ -d "$slug_dir" ] || continue
            slug=$(basename "$slug_dir")
            for year_dir in "$slug_dir"*/; do
              [ -d "$year_dir" ] || continue
              year=$(basename "$year_dir")
              gsutil -m rsync -r "$year_dir" "gs://dataciviclab-clean/${seg}$slug/$year/"
            done
            echo "✅ $slug clean synced"
          done
          for slug_dir in out/data/mart/*/; do
            [ -d "$slug_dir" ] || continue
            slug=$(basename "$slug_dir")
            for year_dir in "$slug_dir"*/; do
              [ -d "$year_dir" ] || continue
              year=$(basename "$year_dir")
              gsutil -m rsync -r "$year_dir" "gs://dataciviclab-mart/${seg}$slug/$year/"
            done
            if compgen -G "$slug_dir*.parquet" > /dev/null; then
              gsutil -m cp "$slug_dir"*.parquet "gs://dataciviclab-mart/${seg}$slug/"
            fi
            echo "✅ $slug mart synced"
          done

      # ── Registry → draft PR ──────────────────────────────────────────
      - name: Registry update PR
        if: ${{ !cancelled() && steps.verify.outcome != 'failure' && steps.gcs-prefix.outcome != 'failure' && (inputs.detect-paths == '' || github.event_name != 'pull_request' || steps.detect.outputs.found == 'true') }}
        uses: dataciviclab/.github/actions/registry-update-pr@main
        with:
          prefix: ${{ steps.gcs-prefix.outputs.value }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
