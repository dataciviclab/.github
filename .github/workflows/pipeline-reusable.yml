# Pipeline Reusable — DataCivicLab
#
# Workflow unico post-merge + refresh. Gestisce:
#   1. checkout + python-setup
#   2. pre-run (opzionale: codelists, bootstrap)
#   3. detect (opzionale: solo dataset cambiati)
#   4. run (make target passato come input)
#   5. GCS auth (WIF) + sync (clean + mart)
#   6. registry → PR draft
#
# Il repo chiama con i propri input:
#   - run-command: comando da eseguire (es. "make run-all" o "toolkit run --batch batch.txt")
#   - repo-slug: prefisso GCS e registry
#   - detect-paths: directory da monitorare (es. "datasets compose"). Vuoto = run all
#   - run-batch-command: comando per il batch selettivo su PR (opzionale)
#
# Batch selettivo (evita di rieseguire tutti i dataset a ogni merge):
#   basta `detect-paths` + un target `run-batch` nel Makefile del repo.
#   Il target può includere i pre-step del repo (seeds, codelists, env) che un
#   comando generico salterebbe. Se nessuno dei due è presente, la pipeline
#   esegue il run completo ed emette un warning.
#   Con `detect-paths` vuoto non si fa detect: il batch non è disponibile.

name: Pipeline (reusable)

on:
  workflow_call:
    inputs:
      repo-slug:
        description: "Slug del repo (es. conto-annuale, siope)"
        required: true
        type: string
      run-command:
        description: "Comando da eseguire per i dataset (es. make run-all)"
        required: true
        type: string
      run-batch-command:
        description: "Comando per il batch selettivo su PR (es. make run-batch). Vuoto = auto-detect: usa `make run-batch` se il Makefile del repo definisce il target, altrimenti `run-command` (con warning se detect-paths e' impostato e il batch viene ignorato)"
        default: ""
        type: string
      sync-pattern:
        description: "flat (rsync intera dir out/) o per-dataset (per slug/year)"
        default: "flat"
        type: string
      pre-run-command:
        description: "Comando pre-run opzionale (es. detect, codelists, bootstrap)"
        default: ""
        type: string
      checkout-ref:
        description: "Ref da checkout (default: github.ref)"
        default: ""
        type: string
      install-extras:
        description: "Extras pyproject da installare (default: dev,pipeline)"
        default: "dev,pipeline"
        type: string
      python-extra-packages:
        description: "Extra packages per pip install"
        default: ""
        type: string
      verify-command:
        description: "Comando verify post-run (default: nessuno)"
        default: ""
        type: string
      extra-env:
        description: "Env vars extra (KEY=VALUE per riga)"
        default: ""
        type: string
      detect-paths:
        description: "Directory da monitorare per detect (es. 'datasets compose'). Vuoto = run all"
        default: ""
        type: string
      runs-on:
        description: "Runner label (es. ubuntu-latest, self-hosted)"
        default: "ubuntu-latest"
        type: string
    secrets:
      GCP_SA_KEY:
        required: false
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: false
      GCP_SERVICE_ACCOUNT:
        required: false

env:
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

jobs:
  pipeline:
    runs-on: ${{ inputs.runs-on || 'ubuntu-latest' }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
          fetch-depth: 0

      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          install-extras: ${{ inputs.install-extras }}
          extra-packages: ${{ inputs.python-extra-packages }}

      # ── Extra env vars (opzionale) ──────────────────────────────────
      - name: Set extra env vars
        if: inputs.extra-env != ''
        run: echo "${{ inputs.extra-env }}" >> "$GITHUB_ENV"

      # ── Pre-run (opzionale: codelists, bootstrap) ───────────────────
      - name: Pre-run
        if: inputs.pre-run-command != ''
        run: ${{ inputs.pre-run-command }}

      # ── Detect changed datasets (solo su PR, skip su schedule/dispatch)
      - name: Detect changed datasets
        if: inputs.detect-paths != '' && github.event_name == 'pull_request'
        id: detect
        uses: dataciviclab/.github/actions/detect-changed-datasets@main
        with:
          paths: ${{ inputs.detect-paths }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build batch from detect
        if: inputs.detect-paths != '' && github.event_name == 'pull_request' && steps.detect.outputs.found == 'true'
        run: |
          : > batch.txt
          for dir in ${{ steps.detect.outputs.dirs }}; do
            [ -f "$dir/dataset.yml" ] && echo "$dir/dataset.yml" >> batch.txt
          done
          echo "📦 $(wc -l < batch.txt | tr -d ' ') dataset da processare"
          cat batch.txt

      - name: Skip — nothing changed
        if: inputs.detect-paths != '' && github.event_name == 'pull_request' && steps.detect.outputs.found != 'true'
        run: echo "✅ Nessun dataset cambiato — skip run"

      # ── Build batch per schedule/dispatch (tutti i dataset) ─────────
      - name: Build batch — all datasets
        if: inputs.detect-paths != '' && github.event_name != 'pull_request'
        run: |
          : > batch.txt
          for base in ${{ inputs.detect-paths }}; do
            [ -d "$base" ] || continue
            find "$base" -maxdepth 2 -name dataset.yml | sort >> batch.txt
          done
          echo "📦 $(wc -l < batch.txt | tr -d ' ') dataset (schedule/dispatch — tutti)"
          cat batch.txt

      # ── Resolve run command (batch vs full) ──────────────────────────
      # Batch selettivo: solo su PR, con detect-paths impostato e batch.txt
      # non vuoto. Ordine di risoluzione (il primo che esiste vince):
      #   1. `run-batch-command` esplicito
      #   2. `make run-batch` se il Makefile del repo definisce il target
      #      (convenzione consigliata: il target può includere i pre-step del
      #      repo — seeds, codelists, env — che un comando generico salterebbe)
      #   3. `run-command` se consuma già batch.txt
      #   4. `run-command` (run completo) + warning: il detect è sprecato
      - name: Resolve run command
        id: run-cmd
        if: inputs.detect-paths == '' || github.event_name != 'pull_request' || steps.detect.outputs.found == 'true'
        env:
          RUN_COMMAND: ${{ inputs.run-command }}
          RUN_BATCH_COMMAND: ${{ inputs.run-batch-command }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -s batch.txt ]; then
            if [ -n "$RUN_BATCH_COMMAND" ]; then
              CMD="$RUN_BATCH_COMMAND"; WHY="run-batch-command"
            elif grep -qE '^run-batch:' Makefile 2>/dev/null; then
              CMD="make run-batch"; WHY="target run-batch nel Makefile"
            elif printf '%s' "$RUN_COMMAND" | grep -q 'batch.txt'; then
              CMD="$RUN_COMMAND"; WHY="run-command consuma batch.txt"
            else
              CMD="$RUN_COMMAND"; WHY=""
            fi
            echo "cmd=$CMD" >> "$GITHUB_OUTPUT"
            if [ -n "$WHY" ]; then
              echo "🔧 Batch mode: $CMD  [$WHY]"
            else
              echo "🔧 Full mode: $CMD"
              echo "::warning title=detect-paths senza batch::detect-paths e' impostato ma il run e' completo: batch.txt viene costruito e ignorato. Definisci un target 'run-batch' nel Makefile (o imposta run-batch-command) per eseguire solo i dataset cambiati."
            fi
          else
            echo "cmd=$RUN_COMMAND" >> "$GITHUB_OUTPUT"
            echo "🔧 Full mode: $RUN_COMMAND"
          fi

      # ── Run datasets ────────────────────────────────────────────────
      - name: Run datasets
        if: inputs.detect-paths == '' || github.event_name != 'pull_request' || steps.detect.outputs.found == 'true'
        run: ${{ steps.run-cmd.outputs.cmd }}

      # ── Verify (opzionale) ──────────────────────────────────────────
      - name: Verify output
        if: inputs.verify-command != ''
        run: ${{ inputs.verify-command }}

      # ── GCS auth + sync ─────────────────────────────────────────────
      - name: GCP Auth (for GCS push)
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != '' && (inputs.detect-paths == '' || github.event_name != 'pull_request' || steps.detect.outputs.found == 'true')
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != '' && (inputs.detect-paths == '' || github.event_name != 'pull_request' || steps.detect.outputs.found == 'true')
        uses: google-github-actions/setup-gcloud@v3

      # Sync flat: rsync intera dir out/ al prefisso repo
      - name: Sync to GCS (flat)
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && inputs.sync-pattern == 'flat' && (inputs.detect-paths == '' || github.event_name != 'pull_request' || steps.detect.outputs.found == 'true')
        run: |
          gsutil -m rsync -r out/data/mart/ gs://dataciviclab-mart/${{ inputs.repo-slug }}/
          gsutil -m rsync -r out/data/clean/ gs://dataciviclab-clean/${{ inputs.repo-slug }}/
          echo "✅ Synced to gs://dataciviclab-mart|clean/${{ inputs.repo-slug }}/"

      # Sync per-dataset: per slug, tutti gli anni
      - name: Sync to GCS (per-dataset)
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && inputs.sync-pattern == 'per-dataset' && (inputs.detect-paths == '' || github.event_name != 'pull_request' || steps.detect.outputs.found == 'true')
        run: |
          for slug_dir in out/data/clean/*/; do
            [ -d "$slug_dir" ] || continue
            slug=$(basename "$slug_dir")
            for year_dir in "$slug_dir"*/; do
              [ -d "$year_dir" ] || continue
              year=$(basename "$year_dir")
              gsutil -m rsync -r "$year_dir" "gs://dataciviclab-clean/${{ inputs.repo-slug }}/$slug/$year/"
            done
            echo "✅ $slug clean synced"
          done
          for slug_dir in out/data/mart/*/; do
            [ -d "$slug_dir" ] || continue
            slug=$(basename "$slug_dir")
            for year_dir in "$slug_dir"*/; do
              [ -d "$year_dir" ] || continue
              year=$(basename "$year_dir")
              gsutil -m rsync -r "$year_dir" "gs://dataciviclab-mart/${{ inputs.repo-slug }}/$slug/$year/"
            done
            echo "✅ $slug mart synced"
          done

      # ── Registry → draft PR ──────────────────────────────────────────
      - name: Registry update PR
        if: inputs.detect-paths == '' || github.event_name != 'pull_request' || steps.detect.outputs.found == 'true'
        uses: dataciviclab/.github/actions/registry-update-pr@main
        with:
          prefix: ${{ inputs.repo-slug }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
